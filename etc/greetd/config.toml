# =============================================================================
# GREETD / TUIGREET CONFIGURATION FILE (/etc/greetd/config.toml)
# Customized for Niri + Noctalia Slate-Blue Theme
# =============================================================================

[terminal]
vt = 1

[default_session]
command = "tuigreet --time --time-format '%A, %d %B %I:%M %p' --remember --remember-session --asterisks --theme 'border=#7D98B3;title=#DCE4EE;prompt=#7D98B3;time=#98ACB9;action=#5B7F95' --greeting 'ThunderdomePC | Niri Desktop' --cmd niri"
user = "greetd"
