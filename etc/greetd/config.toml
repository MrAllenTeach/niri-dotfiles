# =============================================================================
# GREETD / TUIGREET CONFIGURATION FILE (/etc/greetd/config.toml)
# Streamlined Slate-Blue Theme using native tuigreet ANSI color specifiers
# =============================================================================

[terminal]
vt = 1

[default_session]
command = "tuigreet --time --time-format '%A, %d %B %I:%M %p' --remember --remember-session --asterisks --asterisks-char '•' --user-menu --greet-align center --container-padding 2 --window-padding 1 --theme 'border=blue;title=bright-cyan;prompt=blue;time=bright-blue;action=cyan;button=blue' --greeting 'ThunderdomePC | Niri Desktop' --cmd niri"
user = "greetd"
