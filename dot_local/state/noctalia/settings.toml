config_version = 8

[backdrop]
blur_intensity = 0.0
tint_intensity = 0.24999999441206455

[bar.default]
background_opacity = 0.0
border = "#000000"
capsule = true
capsule_thickness = 0.74999998696148396
concave_edge_corners = false
end = [ "notifications", "notes", "clipboard", "bluetooth", "network", "volume", "brightness", "battery", "session" ]
margin_ends = 0
padding = 2
shadow = false
start = [ "wallpaper", "workspaces", "media", "tray" ]
thickness = 30
widget_spacing = 10

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
position = "right"

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 213.0
    box_width = 810.0
    cx = 960.0
    cy = 1009.5
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_session_buttons = true

[nightlight]
enabled = true

[plugin_settings."noctalia/notes"]
panel_placement = "attached"

[plugins]
enabled = [ "noctalia/bitwarden", "noctalia/wallhaven", "noctalia/notes" ]

[shell]
font_family = "JetBrainsMono Nerd Font"
polkit_agent = true

    [shell.launcher]
    compact = true

    [shell.panel]
    transparency_mode = "soft"

    [shell.screenshot]
    confirm_region = true
    directory = "/var/home/fsucory/Pictures/Screenshots"

[theme]
builtin = "Noctalia"
community_palette = "Garnet"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "kitty" ]
    community_ids = [ "antigravity" ]

[wallpaper.default]
path = "/var/home/fsucory/Pictures/Wallpapers/114.jpg"

[wallpaper.last]
path = "/var/home/fsucory/Pictures/Wallpapers/114.jpg"

[wallpaper.monitors.eDP-1]
path = "/var/home/fsucory/Pictures/Wallpapers/114.jpg"

[[wallpaper.favorite]]
path = "/var/home/fsucory/Pictures/Wallpapers/91.jpg"
theme_mode = "auto"

[weather]
refresh_minutes = 15
unit = "imperial"

[widget.clock]
format = "{:%a %d %b} | {:%I:%M %p}"

[widget.network]
show_label = false

[widget.notes]
type = "noctalia/notes:notes"